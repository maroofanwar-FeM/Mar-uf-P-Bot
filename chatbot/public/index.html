<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bot</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 700px;
    margin: 3rem auto;
    padding: 0 1.25rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
  textarea {
    width: 100%;
    min-height: 6rem;
    font: inherit;
    padding: 0.6rem;
    box-sizing: border-box;
    resize: vertical;
  }
  button {
    margin-top: 0.75rem;
    font: inherit;
    padding: 0.5rem 1.25rem;
    cursor: pointer;
  }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  #output {
    margin-top: 1.5rem;
    padding: 1rem;
    border: 1px solid #8884;
    border-radius: 6px;
    min-height: 3rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  #output.error { border-color: #c0392b; color: #c0392b; }
  #output.empty { color: #8888; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline; }
  #logout { background: none; border: none; color: inherit; text-decoration: underline; padding: 0; margin: 0; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>My Bot</h1>
    <button id="logout">Sign out</button>
  </div>

  <textarea id="input" placeholder="Type something for the bot..."></textarea>
  <br>
  <button id="run">Run</button>

  <div id="output" class="empty">Output will show up here.</div>

  <script>
    const input = document.getElementById('input');
    const runButton = document.getElementById('run');
    const output = document.getElementById('output');

    async function run() {
      const text = input.value.trim();
      if (!text) return;

      runButton.disabled = true;
      runButton.textContent = 'Running...';
      output.classList.remove('empty', 'error');
      output.textContent = 'Working on it...';

      try {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: text }),
        });
        const data = await res.json();
        if (!res.ok) {
          output.classList.add('error');
          output.textContent = data.error || 'Something went wrong.';
        } else {
          output.textContent = data.output;
        }
      } catch (e) {
        output.classList.add('error');
        output.textContent = 'Could not reach the server: ' + e.message;
      } finally {
        runButton.disabled = false;
        runButton.textContent = 'Run';
      }
    }

    runButton.addEventListener('click', run);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run();
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
